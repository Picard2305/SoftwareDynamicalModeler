name: Reproduce queue analysis

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest tests/test_queue_analysis_reproducibility.py tests/test_repository_hygiene.py
